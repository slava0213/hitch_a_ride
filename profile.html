<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Профиль</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header><h1>Профиль пользователя</h1></header>

  <nav>
    <ul>
      <li><a href="index.html">Поездки</a></li>
      <li><a href="create-trip.html">Создать поездку</a></li>
      <li><a href="search.html">Поиск</a></li>
      <li><a href="chat.html">Чат</a></li>
      <li><a href="profile.html" class="active">Профиль</a></li>
    </ul>
  </nav>

  <main>
    <h2>Мои данные</h2>
    <form id="profile-form">
      <label>Имя</label><input name="name" />
      <label>Email</label><input name="email" type="email" />
      <label>Телефон</label><input name="phone" />
      <label>Автомобиль</label><input name="car" />
      <label>О себе</label><textarea name="about" rows="3"></textarea>
      <button type="submit">Сохранить</button>
    </form>

    <h2>Мои поездки</h2>
    <div id="my-trips"></div>

    <h2>Мои заявки</h2>
    <div id="my-apps"></div>

    <h2>Отзывы</h2>
    <div id="reviews"></div>
  </main>

  <footer><p>© 2025 Сервис поиска попутчиков</p></footer>

  <script src="js/storage.js"></script>
  <script>
    const profile = DB.get('profile');

    // Заполняем форму
    const form = document.getElementById('profile-form');
    Object.entries(profile).forEach(([k, v]) => {
      if (form[k]) form[k].value = v;
    });

    form.addEventListener('submit', e => {
      e.preventDefault();
      const f = new FormData(form);
      const updated = {};
      for (const [k, v] of f.entries()) updated[k] = v;
      updated.rating = profile.rating;
      DB.set('profile', updated);
      alert('Профиль сохранён!');
    });

    // Мои поездки (где driver = имя профиля)
    const trips = DB.get('trips').filter(t => t.driver === profile.name);
    document.getElementById('my-trips').innerHTML = trips.length
      ? trips.map(t => `<div class="card"><div class="route">${t.from} → ${t.to}</div>
          <div class="meta">${t.date} · мест: ${t.seats - t.taken}/${t.seats}</div></div>`).join('')
      : '<p>Пока нет созданных поездок.</p>';

    // Мои заявки
    const apps = DB.get('applications');
    document.getElementById('my-apps').innerHTML = apps.length
      ? apps.map(a => {
          const trip = DB.get('trips').find(t => t.id === a.tripId);
          return `<div class="card">Заявка на поездку ${trip ? trip.from + ' → ' + trip.to : '—'}
                  <span class="badge">${a.status}</span></div>`;
        }).join('')
      : '<p>Заявок пока нет.</p>';

    // Отзывы
    const reviews = DB.get('reviews');
    document.getElementById('reviews').innerHTML = reviews
      .map(r => `<div class="card"><strong>${r.driver}</strong> — ${'★'.repeat(r.rating)}<p>${r.text}</p></div>`)
      .join('');
  </script>
</body>
</html>
