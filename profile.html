<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Профиль</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header><h1>Профиль пользователя</h1></header>

  <nav>
    <ul>
      <li><a href="index.html">Поездки</a></li>
      <li><a href="create-trip.html">Создать поездку</a></li>
      <li><a href="search.html">Поиск</a></li>
      <li><a href="chat.html">Чат</a></li>
      <li><a href="profile.html" class="active">Профиль</a></li>
    </ul>
  </nav>

  <main>
    <h2>Мои данные</h2>
    <div id="profile-view"><p>Загрузка...</p></div>

    <h2>Мои поездки</h2>
    <div id="my-trips"></div>

    <h2>Мои заявки</h2>
    <div id="my-apps"></div>

    <h2>Отзывы</h2>
    <div id="reviews"></div>
  </main>

  <footer><p>© 2025 Сервис поиска попутчиков</p></footer>

  <script src="js/storage.js"></script>
  <script>
    async function loadProfile() {
      const profiles = await DB.get('profile');
      const p = Array.isArray(profiles) ? profiles[0] || {} : {};
      document.getElementById('profile-view').innerHTML = `
        <div class="card">
          <p><strong>Имя:</strong> ${p.name || '—'}</p>
          <p><strong>Email:</strong> ${p.email || '—'}</p>
          <p><strong>Телефон:</strong> ${p.phone || '—'}</p>
          <p><strong>Автомобиль:</strong> ${p.car || '—'}</p>
          <p><strong>О себе:</strong> ${p.about || '—'}</p>
          <p><strong>Рейтинг:</strong> ⭐ ${p.rating || '—'}</p>
        </div>`;
    }

    async function loadMyTrips() {
      const [trips, profiles] = await Promise.all([
        DB.get('trips'),
        DB.get('profile'),
      ]);
      if (!Array.isArray(trips)) return;

      const me = Array.isArray(profiles) ? profiles[0]?.name : null;
      const mine = trips.filter(t => t.driver === me);

      document.getElementById('my-trips').innerHTML = mine.length
        ? mine
            .map(
              t => `<div class="card">
                <div class="route">${t.from} → ${t.to}</div>
                <div class="meta">${t.date} · мест: ${t.seats - t.taken}/${t.seats}</div>
              </div>`
            )
            .join('')
        : '<p>Пока нет созданных поездок.</p>';
    }

    async function loadMyApps() {
      const [apps, trips] = await Promise.all([
        DB.get('applications'),
        DB.get('trips'),
      ]);
      if (!Array.isArray(apps)) return;

      document.getElementById('my-apps').innerHTML = apps.length
        ? apps
            .map(a => {
              const t = Array.isArray(trips)
                ? trips.find(x => String(x.id) === String(a.tripId))
                : null;
              return `<div class="card">Заявка на поездку ${
                t ? t.from + ' → ' + t.to : '—'
              } <span class="badge">${a.status}</span></div>`;
            })
            .join('')
        : '<p>Заявок пока нет.</p>';
    }

    async function loadReviews() {
      const reviews = await DB.get('reviews');
      if (!Array.isArray(reviews)) return;

      document.getElementById('reviews').innerHTML = reviews.length
        ? reviews
            .map(
              r => `<div class="card"><strong>${r.driver}</strong> — ${'★'.repeat(
                r.rating
              )}<p>${r.text}</p></div>`
            )
            .join('')
        : '<p>Отзывов пока нет.</p>';
    }

    loadProfile();
    loadMyTrips();
    loadMyApps();
    loadReviews();
  </script>
</body>
</html>
