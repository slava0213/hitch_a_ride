<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Создать поездку</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header><h1>Создание поездки</h1></header>

  <nav>
    <ul>
      <li><a href="index.html">Поездки</a></li>
      <li><a href="create-trip.html" class="active">Создать поездку</a></li>
      <li><a href="search.html">Поиск</a></li>
      <li><a href="chat.html">Чат</a></li>
      <li><a href="profile.html">Профиль</a></li>
    </ul>
  </nav>

  <main>
    <form id="trip-form">
      <label>Откуда</label>
      <input name="from" required />

      <label>Куда</label>
      <input name="to" required />

      <label>Дата</label>
      <input type="date" name="date" required />

      <label>Время</label>
      <input type="time" name="time" required />

      <label>Всего мест</label>
      <input type="number" name="seats" min="1" max="8" value="3" required />

      <label>Цена за место, ₽</label>
      <input type="number" name="price" min="0" value="1000" required />

      <label>Автомобиль</label>
      <input name="car" placeholder="Например, Kia Rio" />

      <label>Комментарий</label>
      <textarea name="comment" rows="3" placeholder="Детали поездки, багаж, остановки..."></textarea>

      <button type="submit">Опубликовать поездку</button>
    </form>
  </main>

  <footer><p>© 2025 Сервис поиска попутчиков</p></footer>

  <script src="js/storage.js"></script>
  <script>
    document.getElementById('trip-form').addEventListener('submit', e => {
      e.preventDefault();
      const f = new FormData(e.target);
      const trips = DB.get('trips');
      const profile = DB.get('profile');

      trips.push({
        id: Date.now(),
        from: f.get('from'),
        to: f.get('to'),
        date: f.get('date'),
        time: f.get('time'),
        seats: +f.get('seats'),
        taken: 0,
        price: +f.get('price'),
        driver: profile.name,
        car: f.get('car') || profile.car,
        comment: f.get('comment'),
        status: 'active',
      });

      DB.set('trips', trips);
      alert('Поездка опубликована!');
      location.href = 'index.html';
    });
  </script>
</body>
</html>
